<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakha (సఖ)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 28px;
    }

    .brand-text h1 {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }

    .brand-text p {
      font-size: 12px;
      color: #64748b;
      font-weight: 500;
    }

    .lang-toggle select {
      padding: 6px 10px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
    }

    .status-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 2px solid #22c55e;
      margin-bottom: 16px;
    }

    .status-card.danger {
      border-color: #ef4444;
      background: #fef2f2;
    }

    .status-card.caution {
      border-color: #f59e0b;
      background: #fffbeb;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .status-icon {
      font-size: 22px;
    }

    .status-title {
      font-size: 16px;
      font-weight: 800;
    }

    .status-detail {
      font-size: 13px;
      color: #334155;
      line-height: 1.4;
    }

    .features-list {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 10px;
    }
    .feature-item:last-child { margin-bottom: 0; }

    .btn-explain {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
      margin-bottom: 12px;
    }

    .btn-explain:hover {
      background: #1d4ed8;
    }

    .explain-box {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      color: #1e293b;
      display: none;
      border-left: 4px solid #2563eb;
      margin-bottom: 12px;
    }

    .pilot-export {
      text-align: center;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }

    .btn-export-link {
      font-size: 12px;
      color: #64748b;
      text-decoration: underline;
      background: none;
      border: none;
      cursor: pointer;
    }
    .btn-export-link:hover { color: #0f172a; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div class="brand-text">
        <h1 id="app-title">Sakha (సఖ)</h1>
        <p id="app-subtitle">Your Digital Safety Companion</p>
      </div>
    </div>
    <div class="lang-toggle">
      <select id="lang-selector">
        <option value="en">English</option>
        <option value="te">తెలుగు</option>
        <option value="hi">हिन्दी</option>
      </select>
    </div>
  </header>

  <div id="status-card" class="status-card">
    <div class="status-header">
      <span id="status-icon" class="status-icon">✓</span>
      <div id="status-title" class="status-title">Page Appears Safe</div>
    </div>
    <div id="status-detail" class="status-detail">No scam or deceptive patterns detected on this site.</div>
  </div>

  <div class="features-list">
    <div class="feature-item">
      <span>🔒</span>
      <span>Aadhaar, PAN & Cards Blurred On-Screen</span>
    </div>
    <div class="feature-item">
      <span>🚫</span>
      <span>Scam & Typosquatting Warning Active</span>
    </div>
    <div class="feature-item">
      <span>📲</span>
      <span>Zero Personal Data Leaves Device</span>
    </div>
  </div>

  <button id="btn-explain" class="btn-explain">
    <span>💡</span>
    <span id="explain-btn-text">What is this page asking me?</span>
  </button>

  <div id="explain-output" class="explain-box"></div>

  <div class="pilot-export">
    <button id="btn-export-logs" class="btn-export-link">Download Pilot Telemetry (Zero PII CSV)</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
